<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Logo Gradient (Modern Cyan to Blue) -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background Bulat (Standar Favicon Modern) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Monogram P, B, T -->
  <g fill="none" stroke="url(#logoGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <!-- Atas Huruf T (Garis Horizontal) -->
    <path d="M 140, 150 L 372, 150" />
    
    <!-- Tiang Utama (Gabungan T, P, B) -->
    <path d="M 210, 150 L 210, 390" />
    
    <!-- Loop Atas (Membentuk P dan bagian atas B) -->
    <path d="M 210, 150 L 290, 150 C 340, 150 340, 270 290, 270 L 210, 270" />
    
    <!-- Loop Bawah (Melengkapi huruf B) -->
    <path d="M 210, 270 L 300, 270 C 355, 270 355, 390 290, 390 L 210, 390" />
  </g>
</svg>
      
