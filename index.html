<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal Berita Termux</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f172a; --card: #1e293b; --card-hover: #334155;
    --accent: #38bdf8; --text: #e2e8f0; --muted: #94a3b8; --border: #334155;
  }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.6; min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #0ea5e9, #6366f1);
    padding: 2.5rem 1.5rem; text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
  }
  header h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.5px; }
  header p { margin-top: .5rem; opacity: .9; font-size: .95rem; }
  .status {
    display: inline-block; margin-top: 1rem; padding: .3rem .9rem;
    border-radius: 999px; background: rgba(0,0,0,.25);
    font-size: .8rem; font-weight: 600;
  }
  .status.online::before { content: "🟢 "; }
  .status.offline::before { content: "🔴 "; }
  .status.loading::before { content: "🟡 "; }
  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  .toolbar {
    display: flex; gap: .75rem; flex-wrap: wrap;
    margin-bottom: 1.5rem; align-items: center;
  }
  .toolbar input, .toolbar select {
    padding: .65rem .9rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); font-size: .9rem; outline: none;
  }
  .toolbar input { flex: 1; min-width: 200px; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
  .toolbar button {
    padding: .65rem 1.2rem; border-radius: 8px; border: none;
    background: var(--accent); color: #0f172a; font-weight: 700;
    cursor: pointer; transition: transform .15s, filter .15s;
  }
  .toolbar button:hover { transform: translateY(-2px); filter: brightness(1.1); }
  #news-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 1.5rem;
  }
  .card {
    display: flex; flex-direction: column;
    background: var(--card); border-radius: 14px;
    overflow: hidden; text-decoration: none; color: var(--text);
    border: 1px solid var(--border);
    transition: transform .2s, background .2s, box-shadow .2s;
  }
  .card:hover {
    transform: translateY(-4px); background: var(--card-hover);
    box-shadow: 0 8px 24px rgba(56,189,248,.25);
  }
  .card img {
    width: 100%; height: 170px; object-fit: cover;
    display: block; background: #0f172a;
  }
  .card-body {
    padding: 1rem 1.1rem 1.2rem; flex: 1;
    display: flex; flex-direction: column;
  }
