<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Termux File Manager</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #f4f4f9;
            font-family: sans-serif;
            overflow: hidden;
        }
        #frame {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            text-align: center;
            padding: 20px;
            font-family: sans-serif;
        }
        #overlay.hidden { display: none; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #00bcd4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .info {
            font-size: 13px;
            color: #ccc;
            margin-top: 6px;
            line-height: 1.5;
            max-width: 400px;
        }
        .url {
            font-size: 12px;
            color: #00bcd4;
            margin-top: 12px;
            word-break: break-all;
        }
        .btn-retry {
            margin-top: 20px;
            padding: 10px 20px;
            background: #00bcd4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-retry:hover { background: #0097a7; }
        .btn-retry:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <!-- Overlay loading / error -->
    <div id="overlay">
        <div class="spinner" id="spinner"></div>
        <div class="title" id="statusMsg">Menghubungkan ke server Termux...</div>
        <div class="info" id="infoMsg">
            Pastikan <b>run.sh</b> sudah jalan di Termux.
        </div>
        <div class="url" id="urlMsg"></div>
        <button class="btn-retry" id="btnRetry" style="display:none;" onclick="reloadFrame()">
            Coba Lagi
        </button>
    </div>

    <!-- Iframe yang load halaman Termux -->
    <iframe id="frame" src="" allow="clipboard-write"></iframe>

    <script>
    // ==========================================================
    // URL SERVEO KAMU
    // ==========================================================
    const TERMUX_URL = "https://av.serveousercontent.com";
    // ==========================================================

    const frame = document.getElementById('frame');
    const overlay = document.getElementById('overlay');
    const statusMsg = document.getElementById('statusMsg');
    const infoMsg = document.getElementById('infoMsg');
    const urlMsg = document.getElementById('urlMsg');
    const spinner = document.getElementById('spinner');
    const btnRetry = document.getElementById('btnRetry');

    let timeoutId = null;

    function reloadFrame() {
        overlay.classList.remove('hidden');
        spinner.style.display = 'block';
        statusMsg.textContent = 'Menghubungkan ke server Termux...';
        infoMsg.innerHTML = 'Pastikan <b>run.sh</b> sudah jalan di Termux.';
        urlMsg.textContent = TERMUX_URL;
        btnRetry.style.display = 'none';

        // Cache-buster biar browser gak pakai versi lama
        frame.src = TERMUX_URL + '?t=' + Date.now();

        // Timeout 15 detik → anggap gagal
        clearTimeout(timeoutId);
        timeoutId = setTimeout(showError, 15000);
    }

    function showError() {
        spinner.style.display = 'none';
        statusMsg.textContent = 'Gagal terhubung ke server Termux';
        infoMsg.innerHTML =
            '1. Pastikan <b>run.sh</b> jalan di Termux<br>' +
            '2. Pastikan subdomain <b>av</b> masih aktif<br>' +
            '3. Pastikan internet HP lancar';
        btnRetry.style.display = 'inline-block';
    }

    // Kalau iframe selesai load → sembunyikan overlay
    frame.addEventListener('load', () => {
        clearTimeout(timeoutId);
        overlay.classList.add('hidden');
    });

    frame.addEventListener('error', showError);

    // Mulai
    reloadFrame();
    </script>
</body>
</html>
